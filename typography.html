<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbora Sadecka - Typography</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.svg">

    <link rel="stylesheet" type="text/css" href="style.css">

</head>
<body>
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <header>
        <nav>
            <div class="logo">
                <a href="index.html">Barussad</a>
            </div>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Work</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="menu-icon" id="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <main>
        <div class="business container">
            <h2 class="work-text">Typography</h2>
            <p class="description">Original typefaces made for an indie band concert. Specifically for the bands Safe Exit, Ornament and Louband.</p>
        </div>

        <section class="items">
            <div class="items-container cara">
                <div class="vl" ></div>
                <img class="analogue photo work-image" src="images/typeface1.png" alt="typeface 1" width="500">
                <img class="analogue photo work-image" src="images/typeface2.png" alt="typeface 2" width="500">
            </div>
        </section>

        <img class="center work-image" src="images/typeface_posters.png" alt="typeface posters" width="1000">

        <section class="items">
            <div class="items-container mobile-layout">

                <div class="vl" ></div>

                <section class="carousel-single-small">
                    <button class="carousel-single-small-btn prev" aria-label="Previous poster">&#10094;</button>

                    <div class="carousel-single-small-window">
                        <div class="carousel-single-small-track">
                        <img src="images/typo_mockup2.png" alt="mockup">
                        <img src="images/typo_mockup.png" alt="mockup 2">
                        </div>

                    </div>

                    <button class="carousel-single-small-btn next" aria-label="Next poster">&#10095;</button>
                </section>

                <section class="carousel-single-small">
                    <button class="carousel-single-small-btn prev" aria-label="Previous poster">&#10094;</button>

                    <div class="carousel-single-small-window">
                        <div class="carousel-single-small-track">
                        <img src="images/typo_poster1.png" alt="poster 1">
                        <img src="images/typo_poster2.png" alt="poster 2">
                        <img src="images/typo_poster3.png" alt="poster 3">
                        </div>
                    </div>

                    <button class="carousel-single-small-btn next" aria-label="Next poster">&#10095;</button>
                </section>

            </div>
        </section>
        
    </main>

    <footer>
        <a href="contact.html" target="_blank" aria-label="Email"><img src="images/ic--outline-email.svg" alt="Email"></a>
        <a href="https://www.instagram.com/barussad/" target="_blank" aria-label="Instagram"><img src="images/line-md--instagram.svg" alt="Instagram"></a>
        <a href="https://www.behance.net/barborasadecka" target="_blank" aria-label="Behance"><img src="images/ri--behance-line.svg" alt="Behance"></a>
    </footer>
    
    <script src="index.js"></script>
</body>
</html>
