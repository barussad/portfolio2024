<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbora Sadecka - Unreal Engine - VR</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.svg">

    <link rel="stylesheet" type="text/css" href="style.css">

</head>
<body>
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>
    
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">Barussad</a>
            </div>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Work</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="menu-icon" id="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <main>
        <div class="vr container">
            <h2>Unreal Engine | VR</h2>
        </div>

        <section class="items">
            <div class="items-container mobile-layout">

                <section class="carousel-single-small">
                    <button class="carousel-single-small-btn prev" aria-label="Previous poster">&#10094;</button>

                    <div class="carousel-single-small-window">
                        <div class="carousel-single-small-track">
                        <img src="images/carousel4.png" alt="photo 1">
                        <img src="images/carousel2.png" alt="photo 2">
                        <img src="images/carousel3.png" alt="photo 3">
                        </div>
                    </div>

                    <button class="carousel-single-small-btn next" aria-label="Next poster">&#10095;</button>
                </section>

                <div class="items-text work-text one">
                    <p>This shoe was designed entirely in Virtual Reality using the software Gravity Sketch and HTC Vive</p>
                </div>
            </div>
        </section>

        <div class="whitebg">
            <hr class="fancy-hr">
        </div>

        <section class="items">
            <div class="items-container mobile-layout">
                <img id="vr" class="work-image two" src="images/vr_shoes.svg" alt="vr shoes">
                <div class="items-text work-text one">
                    <p>This shoe was designed entirely in Virtual Reality using the software Gravity Sketch and HTC Vive</p>
                </div>
            </div>
        </section>

        <img class="center work-image" src="images/vr_model_shoesvg.svg" alt="vr model">


    </main>
    

    <footer>
        <a href="contact.html" target="_blank" aria-label="Email"><img src="images/ic--outline-email.svg" alt="Email"></a>
        <a href="https://www.instagram.com/barussad/" target="_blank" aria-label="Instagram"><img src="images/line-md--instagram.svg" alt="Instagram"></a>
        <a href="https://www.behance.net/barborasadecka" target="_blank" aria-label="Behance"><img src="images/ri--behance-line.svg" alt="Behance"></a>
    </footer>
    
    <script src="index.js"></script>
</body>
</html>
